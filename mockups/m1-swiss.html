<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>APC — Swiss Grid</title>
<style>
  :root { --ink:#111; --paper:#fff; --red:#e2231a; --grid:#e6e6e6;
          --sans:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;
       display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1200px;width:100%;margin:0 auto;padding:40px;flex:1;display:flex;flex-direction:column;}
  .row{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.04em;text-transform:uppercase;}
  .row .r{color:#888;}
  hr{border:0;border-top:1px solid var(--ink);margin:18px 0 0;}
  .hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:60px 0;}
  h1{font-size:clamp(54px,11vw,150px);line-height:.92;letter-spacing:-.04em;font-weight:700;max-width:14ch;}
  h1 .sq{color:var(--red);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:56px;}
  .grid p{font-size:14px;line-height:1.5;color:#333;grid-column:span 1;}
  .grid .num{color:var(--red);font-weight:700;display:block;margin-bottom:8px;}
  @media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr);} h1{font-size:64px;}}
  .foot{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.04em;text-transform:uppercase;}
  .foot a{color:var(--red);text-decoration:none;}
</style></head>
<body>
  <div class="wrap">
    <div class="row"><span>Anti PayPal Club</span><span class="r">Est. 2026</span></div>
    <hr/>
    <div class="hero">
      <h1>Stop paying<br/>to <span class="sq">be paid</span>.</h1>
      <div class="grid">
        <p><span class="num">01</span>Up to 5% taken on every cross-border payment.</p>
        <p><span class="num">02</span>A 3–4% currency spread, quietly applied.</p>
        <p><span class="num">03</span>Funds frozen for 180 days. No appeal.</p>
        <p><span class="num">04</span>No one to call when it happens to you.</p>
      </div>
    </div>
    <hr style="margin-bottom:18px"/>
    <div class="foot"><span>A public record of PayPal's fees &amp; holds</span><span><a href="#">There's a way out →</a></span></div>
  </div>
</body></html>

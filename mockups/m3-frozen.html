<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>APC — Frozen</title>
<style>
  :root { --black:#08090c; --bone:#eef0f2; --ice:#9fc4d8; --dim:#7c828c;
          --sans:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--black);color:var(--bone);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;}
  .hero{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;}
  .bg{position:absolute;inset:0;background:
      linear-gradient(180deg,rgba(8,9,12,.15),rgba(8,9,12,.85) 82%,var(--black)),
      url('../assets/hero.jpg');background-size:cover;background-position:center;}
  .top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;
       padding:28px 40px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone);}
  .wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;width:100%;padding:0 40px 70px;}
  h1{font-size:clamp(46px,11vw,150px);line-height:.9;letter-spacing:-.035em;text-transform:uppercase;font-weight:800;}
  h1 em{font-style:normal;color:var(--ice);}
  .sub{margin-top:26px;color:#c7cbd1;font-size:clamp(15px,2vw,19px);max-width:42ch;line-height:1.5;}
  .out{margin-top:34px;font-size:13px;letter-spacing:.06em;color:var(--dim);}
  .out a{color:var(--ice);text-decoration:none;}
</style></head>
<body>
  <div class="hero">
    <div class="bg"></div>
    <div class="top"><span>Anti&nbsp;PayPal&nbsp;Club</span><span>Frozen&nbsp;Assets</span></div>
    <div class="wrap">
      <h1>Your money,<br/><em>on ice</em>.</h1>
      <p class="sub">PayPal can freeze your funds for 180 days. No reason. No appeal. No one to call.</p>
      <p class="out">Some funds find their way home. <a href="#">→ peanut.me</a></p>
    </div>
  </div>
</body></html>

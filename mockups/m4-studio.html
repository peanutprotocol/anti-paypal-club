<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>APC — Studio</title>
<style>
  :root { --bg:#e8e9eb; --ink:#15161a; --dim:#8a8d93; --sans:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;
       display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
  .top{display:flex;justify-content:space-between;padding:30px 44px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;}
  .top .r{color:var(--dim);}
  main{flex:1;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:40px;
       max-width:1240px;margin:0 auto;width:100%;padding:0 44px 60px;}
  @media(max-width:820px){main{grid-template-columns:1fr;text-align:center;}}
  h1{font-size:clamp(42px,7vw,96px);line-height:.95;letter-spacing:-.035em;font-weight:700;}
  .sub{margin-top:26px;font-size:17px;line-height:1.55;color:#3c3e44;max-width:34ch;}
  @media(max-width:820px){.sub{margin-left:auto;margin-right:auto;}}
  .out{margin-top:30px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;}
  .out a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:2px;}
  .art{position:relative;}
  .art img{width:100%;height:auto;display:block;}
  .cap{margin-top:14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-align:right;}
</style></head>
<body>
  <div class="top"><span>Anti&nbsp;PayPal&nbsp;Club</span><span class="r">No.&nbsp;01 — Holds</span></div>
  <main>
    <div>
      <h1>It isn't<br/>your money<br/>anymore.</h1>
      <p class="sub">The moment it's held, it belongs to a process. Lower fees, no freezes, and a way out.</p>
      <p class="out"><a href="#">There's a better card →</a></p>
    </div>
    <div class="art">
      <img src="../assets/studio-card.png" alt="" />
      <div class="cap">Specimen — funds, withheld</div>
    </div>
  </main>
</body></html>

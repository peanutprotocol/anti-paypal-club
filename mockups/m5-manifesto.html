<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>APC — Manifesto</title>
<style>
  :root { --paper:#f1ede3; --ink:#1b1a17; --oxblood:#7a2618; --dim:#8c887c;
          --serif:Georgia,"Times New Roman",serif; --sans:"Helvetica Neue",Helvetica,Arial,sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);min-height:100vh;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:34px 48px 56px;min-height:100vh;display:flex;flex-direction:column;}
  .top{display:flex;justify-content:space-between;font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);}
  .top b{color:var(--ink);font-weight:400;}
  main{flex:1;display:grid;grid-template-columns:1.4fr 1fr;gap:56px;align-items:center;padding:48px 0;}
  @media(max-width:820px){main{grid-template-columns:1fr;}}
  h1{font-size:clamp(40px,7.5vw,104px);line-height:1.0;letter-spacing:-.015em;font-weight:400;}
  h1 i{color:var(--oxblood);}
  .lede{font-family:var(--sans);font-size:15px;line-height:1.7;color:#3b392f;max-width:40ch;margin-top:30px;}
  .art img{width:100%;height:auto;display:block;filter:saturate(.92);}
  .art .cap{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:12px;}
  .foot{font-family:var(--sans);font-size:12px;letter-spacing:.04em;color:var(--dim);border-top:1px solid #d8d2c4;padding-top:18px;display:flex;justify-content:space-between;}
  .foot a{color:var(--oxblood);text-decoration:none;}
</style></head>
<body>
  <div class="wrap">
    <div class="top"><b>Anti PayPal Club</b><span>A Quiet Objection</span></div>
    <main>
      <div>
        <h1>They froze it.<br/>They called it<br/><i>protection</i>.</h1>
        <p class="lede">A record of the fees, the spreads, and the 180-day holds — and a plain case for keeping your money where no one can freeze it.</p>
      </div>
      <div class="art">
        <img src="../assets/shadow-card.png" alt="" />
        <div class="cap">Exhibit — held indefinitely</div>
      </div>
    </main>
    <div class="foot"><span>Operated by the team behind Peanut</span><a href="#">peanut.me →</a></div>
  </div>
</body></html>
